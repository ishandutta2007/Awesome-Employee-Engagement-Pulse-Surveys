<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pulseLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.3px;
    }
    
    /* Dynamic pulsing animation */
    @keyframes pulseDash {
      0% {
        stroke-dashoffset: 1200;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }
    
    @keyframes floatOrb {
      0%, 100% {
        transform: translateY(0px) scale(1);
        opacity: 0.35;
      }
      50% {
        transform: translateY(-18px) scale(1.08);
        opacity: 0.65;
      }
    }

    @keyframes radarSweep {
      0% {
        r: 4;
        opacity: 0.9;
      }
      100% {
        r: 32;
        opacity: 0;
      }
    }

    .pulsing-wave {
      stroke-dasharray: 600 600;
      animation: pulseDash 8s linear infinite;
    }

    .orb-1 {
      animation: floatOrb 7s ease-in-out infinite;
    }

    .orb-2 {
      animation: floatOrb 9s ease-in-out 1.5s infinite;
    }

    .radar-pulse {
      animation: radarSweep 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    .radar-pulse-delayed {
      animation: radarSweep 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) 1.25s infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Animated Ambient Floating Orbs in Background -->
  <g>
    <circle class="orb-1" cx="200" cy="90" r="110" fill="#38bdf8" filter="url(#softGlow)" />
    <circle class="orb-2" cx="1020" cy="310" r="130" fill="#a855f7" filter="url(#softGlow)" />
    <circle class="orb-1" cx="900" cy="110" r="80" fill="#ec4899" filter="url(#softGlow)" />
  </g>

  <!-- Dynamic Pulse EKG Waveform Layer (Placed behind foreground text) -->
  <g opacity="0.75">
    <path class="pulsing-wave" 
          d="M 0 320 Q 150 320 280 320 L 330 320 L 350 260 L 375 380 L 405 220 L 435 340 L 455 310 L 475 320 L 680 320 L 710 270 L 735 360 L 760 240 L 790 340 L 810 320 L 1200 320" 
          fill="none" 
          stroke="url(#pulseLineGrad)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />

    <!-- Radar Pulse Markers along Wave -->
    <g transform="translate(405, 220)">
      <circle class="radar-pulse" cx="0" cy="0" r="10" stroke="#38bdf8" stroke-width="2" fill="none" />
      <circle class="radar-pulse-delayed" cx="0" cy="0" r="10" stroke="#818cf8" stroke-width="1.5" fill="none" />
      <circle cx="0" cy="0" r="4.5" fill="#38bdf8" filter="url(#glow)" />
    </g>

    <g transform="translate(760, 240)">
      <circle class="radar-pulse" cx="0" cy="0" r="10" stroke="#ec4899" stroke-width="2" fill="none" />
      <circle class="radar-pulse-delayed" cx="0" cy="0" r="10" stroke="#c084fc" stroke-width="1.5" fill="none" />
      <circle cx="0" cy="0" r="4.5" fill="#ec4899" filter="url(#glow)" />
    </g>
  </g>

  <!-- Subtle Top & Border Glow -->
  <rect width="1200" height="420" rx="16" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.4" />

  <!-- Foreground Content: Header Tag Pill -->
  <g transform="translate(100, 52)">
    <rect width="280" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="18" cy="16" r="5" fill="#10b981" />
    <circle cx="18" cy="16" r="9" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.6" />
    <text class="badge-text" x="35" y="21" fill="#38bdf8">CONTINUOUS LISTENING &amp; eNPS</text>
  </g>

  <!-- Foreground Main Title & Subtitle (Clean, High Contrast, Foreground Protected) -->
  <g transform="translate(100, 140)">
    <text class="title" fill="url(#primaryGrad)">
      Awesome Employee Engagement
    </text>
    <text class="title" y="48" fill="#f8fafc">
      &amp; Pulse Surveys
    </text>
    
    <text class="subtitle" y="96">
      Curated ecosystem of SaaS leaders, open-source survey infrastructure, and eNPS engines.
    </text>
  </g>

  <!-- Foreground Feature Badges / Highlights -->
  <g transform="translate(100, 310)">
    <!-- Pill 1: Pulse Surveys -->
    <g transform="translate(0, 0)">
      <rect width="165" height="38" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
      <text class="badge-text" x="18" y="24" fill="#38bdf8">⚡ Weekly Pulses</text>
    </g>

    <!-- Pill 2: eNPS & Sentiment -->
    <g transform="translate(180, 0)">
      <rect width="175" height="38" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
      <text class="badge-text" x="18" y="24" fill="#818cf8">📊 eNPS &amp; Analytics</text>
    </g>

    <!-- Pill 3: Anonymity -->
    <g transform="translate(370, 0)">
      <rect width="210" height="38" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
      <text class="badge-text" x="18" y="24" fill="#c084fc">🔒 Anonymous Feedback</text>
    </g>

    <!-- Pill 4: Open Source & Self-Hosted -->
    <g transform="translate(595, 0)">
      <rect width="215" height="38" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
      <text class="badge-text" x="18" y="24" fill="#34d399">💻 Open Source Ready</text>
    </g>
  </g>
</svg>
